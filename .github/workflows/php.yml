name: PHP validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Lint module sources
        run: find Scrim tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run unit tests
        run: composer test
